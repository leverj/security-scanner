name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Run the JavaScript actions on Node 24 today — Node 20 is being removed from
  # runners on 2026-09-16. Forced-default begins 2026-06-02.
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check security_scan/ tests/

      - name: Tests (pytest)
        run: pytest -q

  docker-build:
    # Build the image on PR/push to catch Dockerfile regressions without pushing it anywhere.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: security-scan:ci
          # Disable provenance/sbom for faster CI; can re-enable when we cut a release.
          provenance: false

  image-runtime:
    # Build natively on each published platform and run the image's runtime
    # contract (tests/image/run.sh): all lanes complete on a normal run (exit 0)
    # and a rejected board sync fails the job (exit 4). Native runners matter:
    # under QEMU some of the Go tools fault inside their runtime.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: security-scan:ci
          provenance: false

      - name: Runtime contract
        run: tests/image/run.sh security-scan:ci
